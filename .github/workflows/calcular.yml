name: Calcular con Python y Desplegar

on:
  workflow_dispatch:
    inputs:
      num1:
        description: 'Primer número'
        required: true
        type: number
      num2:
        description: 'Segundo número'
        required: true
        type: number

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔢 Ejecutar cálculo y generar HTML
        run: python generar.py ${{ github.event.inputs.num1 }} ${{ github.event.inputs.num2 }}

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 🌐 Desplegar en Pages
        uses: actions/deploy-pages@v4